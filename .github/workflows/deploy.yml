name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Unit tests, KATs and the CSP hash guard
        run: npm test
      - name: Independent cross-check (no code path shared with the runtime)
        run: npm run test:oracle
      - run: npm run build
      - uses: actions/configure-pages@v6
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Rendered-verdict claims suite
        run: npm run test:e2e
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      # The quality failures no accessibility rule reports: text too small to read,
      # a dead gap in the hero, a landing page a mile long with its first action
      # below the fold. See the header of e2e/geometry.spec.ts.
      - name: Geometry and density gate
        run: npm run test:geometry
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    needs: build
    # A pull request is tested, never published. NOT `== 'push'`: that would also
    # skip workflow_dispatch, which is the trigger the auto-merge below depends on.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
